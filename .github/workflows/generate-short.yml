name: Generate Short

on:
  schedule:
    # 09:00 UTC daily
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to use (leave empty to let the AI pick one)"
        required: false
        type: string
      runs:
        description: "How many videos to generate"
        required: false
        default: "1"
        type: string
      voice:
        description: "edge-tts voice"
        required: false
        default: "en-US-AvaNeural"
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    # Rendering 9 scenes plus the final stitch takes a while on a hosted runner.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py --check

      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Passed as env rather than interpolated into the script, so a topic
          # containing shell metacharacters cannot break out of the command.
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_RUNS: ${{ inputs.runs || '1' }}
          INPUT_VOICE: ${{ inputs.voice || 'en-US-AvaNeural' }}
        run: |
          ARGS=(--runs "$INPUT_RUNS" --voice "$INPUT_VOICE")
          if [ -n "$INPUT_TOPIC" ]; then
            ARGS+=(--topic "$INPUT_TOPIC")
          fi
          python main.py "${ARGS[@]}"

      - name: Upload video
        # Publish whatever rendered, even if a later run in a batch failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: assets/final/*.mp4
          if-no-files-found: error
          retention-days: 14
